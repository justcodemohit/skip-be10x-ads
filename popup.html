<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font: 14px system-ui, sans-serif; width: 300px; padding: 14px; }
  h1 { font-size: 16px; margin: 0 0 12px; }
  label { display: block; margin: 10px 0 4px; }
  .row { display: flex; align-items: center; gap: 8px; margin: 8px 0; }
  textarea { width: 100%; height: 110px; box-sizing: border-box; resize: vertical; }
  input[type=number] { width: 60px; }
  small { color: #666; }
</style>
</head>
<body>
  <h1>YT Ad Speeder</h1>
  <div class="row"><input type="checkbox" id="enabled"><label for="enabled" style="margin:0">Enabled</label></div>
  <div class="row"><input type="checkbox" id="matchAll"><label for="matchAll" style="margin:0">Apply to ALL ads (ignore keywords)</label></div>
  <div class="row"><label for="speed" style="margin:0">Ad speed</label><input type="number" id="speed" min="1" max="16" step="0.25">x</div>
  <label for="keywords">Keywords (one per line)</label>
  <textarea id="keywords" placeholder="nike&#10;temu&#10;nike.com"></textarea>
  <small>Matched against the advertiser name, URL and button text shown in the ad. Saves automatically.</small>
  <script src="popup.js"></script>
</body>
</html>
